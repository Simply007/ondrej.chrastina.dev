# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ source ]
  pull_request:
    branches: [ source ]
  workflow_dispatch:

jobs:
  build:  
    runs-on: ubuntu-latest
    
    env:
      KONTENT_PROJECT_ID: ${{ secrets.KONTENT_PROJECT_ID }}
      KONTENT_LANGUAGE_CODENAMES: ${{ secrets.KONTENT_LANGUAGE_CODENAMES }}

    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js
      uses: actions/setup-node@v2
      with:
        node-version-file: '.nvmrc'
    - run: npm install
    # unit tests (node:test, tests/**/*.test.js) gate the build and the deploy
    - run: npm test
    - run: npm run build
    # IndexNow (lib/indexnow.js) submits only what changed since the live site
    - name: Save the live sitemap
      if: github.ref == 'refs/heads/source'
      run: curl -sf https://ondrej.chrastina.dev/sitemap.xml -o "$RUNNER_TEMP/previous-sitemap.xml" || true
    - name: Deploy 🚀
      if: github.ref == 'refs/heads/source'
      uses: JamesIves/github-pages-deploy-action@3.7.1
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BRANCH: master
        FOLDER: public
        CLEAN: true # Automatically remove deleted files from the deploy branch
    - name: Notify IndexNow (Bing, Seznam)
      if: github.ref == 'refs/heads/source'
      continue-on-error: true
      timeout-minutes: 20
      run: node lib/indexnow.js "$RUNNER_TEMP/previous-sitemap.xml" public/sitemap.xml
